<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdoms of Eternity</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#172c3b;color:white;font-family:Arial;text-align:center}
header{padding:15px;background:#101b28;border-bottom:2px solid #d5ae65}
h1{font-size:22px;color:#f3d28c;margin:5px}
.resources{display:flex;justify-content:space-around;padding:12px 3px;background:#263b46}
.resource{font-size:13px}
.resource strong{display:block;color:#ffe09b;font-size:17px}
.scene{height:65vh;min-height:350px;position:relative;overflow:hidden;background:linear-gradient(#80b5d0 0%,#c6d8c9 60%,#526e40 60%,#304c2c 100%)}
.sun{position:absolute;right:12%;top:8%;width:55px;height:55px;border-radius:50%;background:#ffe9a2;box-shadow:0 0 40px #ffe9a2}
.castle{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:260px;height:230px}
.keep{position:absolute;left:65px;top:60px;width:130px;height:130px;background:#c8c1a9;border:4px solid #716c60;box-shadow:8px 8px 0 #777264}
.tower{position:absolute;width:53px;height:155px;bottom:20px;background:#bcb5a0;border:4px solid #716c60}
.tower.left{left:20px}
.tower.right{right:20px}
.roof{position:absolute;top:-38px;left:-7px;width:0;height:0;border-left:31px solid transparent;border-right:31px solid transparent;border-bottom:42px solid #843d35}
.keep .roof{top:-55px;left:27px;border-left:40px solid transparent;border-right:40px solid transparent;border-bottom:60px solid #79382f}
.door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:53px;width:30px;background:#533626;border-radius:15px 15px 0 0;border:3px solid #e1bd75}
.window{position:absolute;top:40px;width:15px;height:25px;background:#273f4c;border-radius:8px 8px 0 0;border:2px solid #e6d5a9}
.w1{left:23px}.w2{right:23px}
.flag{position:absolute;top:-15px;left:50%;height:30px;width:4px;background:#d7bd7c}
.flag:after{content:"";position:absolute;left:4px;top:0;width:28px;height:17px;background:#9c3434;clip-path:polygon(0 0,100% 0,80% 50%,100% 100%,0 100%)}
.path{position:absolute;bottom:-70px;left:50%;transform:translateX(-50%);width:90px;height:130px;background:#b8a17b;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.label{position:absolute;bottom:12px;width:100%;font-size:14px;text-shadow:0 2px 3px black}
.panel{padding:18px;background:#172431}
button{padding:14px 25px;background:#d6ad60;border:2px solid #f6dda1;border-radius:7px;color:#281b0b;font-size:16px;font-weight:bold}
#status{margin:12px;color:#ffe0a0}
</style>
</head>
<body>
<header>
<h1>♛ KINGDOMS OF ETERNITY</h1>
<div>Lord of Dawn · Main Castle</div>
</header>
<div class="resources">
<div class="resource">🌾<strong>10,000</strong>Food</div>
<div class="resource">🪵<strong>10,000</strong>Wood</div>
<div class="resource">🪨<strong>10,000</strong>Stone</div>
<div class="resource">🪙<strong>5,000</strong>Gold</div>
</div>
<div class="scene">
<div class="sun"></div>
<div class="castle">
<div class="path"></div>
<div class="tower left"><div class="roof"></div><div class="window"></div></div>
<div class="tower right"><div class="roof"></div><div class="window"></div></div>
<div class="keep">
<div class="roof"></div>
<div class="flag"></div>
<div class="window w1"></div><div class="window w2"></div>
<div class="door"></div>
</div>
</div>
<div class="label">YOUR KINGDOM · MAIN CASTLE</div>
</div>
<div class="panel">
<h2>Main Castle — Level <span id="level">1</span></h2>
<p>Upgrade your castle to strengthen your kingdom.</p>
<button onclick="upgrade()">⬆ UPGRADE CASTLE</button>
<div id="status">Next upgrade: 500 Food + 500 Wood</div>
</div>
<script>
let level=1;
function upgrade(){
level++;
document.getElementById('level').textContent=level;
document.getElementById('status').textContent=
'Upgrade successful! Castle Level '+level;
}
</script>
</body>
</html>
